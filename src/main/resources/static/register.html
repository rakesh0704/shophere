<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>
<div id="toast"></div>
<nav>

    <h2>🛒 ShopHere</h2>

</nav>

<div class="auth-box">

    <h2>Register</h2>

    <input
        type="text"
        id="regUsername"
        placeholder="👤 Full Name">

    <input
        type="email"
        id="regEmail"
        placeholder="Email">

    <input
    type="password"
    id="regPassword"
    placeholder="🔒 Password">
    <small id="passwordError"></small>
        <small id="passwordHint">

    Password must contain:

    1 Capital Letter,
    1 Small Letter,
    1 Number,
    1 Special Character

</small>
    <button onclick="registerUser()">
        Register
    </button>

    <p>

    Already have an account?

    <a href="login.html">

        Login

    </a>

</p>

</div>
<script>
    redirectIfLoggedIn();
</script>
<script src="app.js"></script>

</body>

</html>
