<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Checkout</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<nav>

    <h2>🛒 ShopHere</h2>

    <div>

        <span id="welcomeUser"></span>

        <button onclick="window.location.href='products.html'">
            Products
        </button>

        <button onclick="window.location.href='wishlist.html'">
            Wishlist
        </button>

        <button onclick="window.location.href='cart.html'">
            Cart
        </button>

        <button onclick="window.location.href='orders.html'">
            Orders
        </button>

        <button onclick="logout()">
            Logout
        </button>

    </div>

</nav>

<h2 class="title">
    Checkout
</h2>

<div id="checkoutForm"
     class="auth-box">

    <input
        type="text"
        id="customerName"
        placeholder="Name">

    <input
        type="email"
        id="customerEmail"
        placeholder="Email">

    <input
        type="text"
        id="customerPhone"
        placeholder="Phone">

    <textarea
        id="customerAddress"
        placeholder="Address">
    </textarea>

    <button onclick="placeOrder()">
        Confirm Order
    </button>

</div>

<script src="app.js"></script>

</body>

</html>
