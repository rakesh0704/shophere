<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Checkout</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>
<div id="toast"></div>
<nav>

    <h2>🛒 ShopHere</h2>

    <div>

        <span id="welcomeUser"></span>

        <button onclick="window.location.href='products.html'">
            Products
        </button>

        <button onclick="window.location.href='wishlist.html'">
            Wishlist
        </button>

        <button onclick="window.location.href='cart.html'">
            Cart
        </button>

        <button onclick="window.location.href='orders.html'">
            Orders
        </button>
        <button
    id="adminBtn"
    onclick="window.location.href='admin.html'"
    style="display:none;">

    Admin

</button>
        <button onclick="logout()">
            Logout
        </button>

    </div>

</nav>

<h2 class="title">
    Checkout
</h2>

<div id="checkoutForm"
     class="auth-box">

    <input
        type="text"
        id="customerName"
        placeholder="Name">

    <input
    id="customerEmail"
    type="email"
    placeholder="📧 Email Address">

<input
    id="customerPhone"
    type="tel"
    maxlength="10"
    pattern="[0-9]{10}"
    placeholder="📱 Mobile Number (10 Digits)"
    required>

<textarea
    id="customerAddress"
    placeholder="🏠 Delivery Address">
</textarea>

<button
    onclick="goToPayment()">

    Proceed To Payment

</button>
</div>

<script src="app.js"></script>

</body>

</html>
