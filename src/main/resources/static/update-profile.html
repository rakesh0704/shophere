<!DOCTYPE html>
<html>

<head>

    <title>Update Profile</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<nav>

    <h2>ShopHere</h2>

</nav>

<div class="auth-container">

    <div class="auth-box">

        <h2>Update Profile</h2>

<label>

    Mobile Number

</label>

<input
    type="text"
    id="phoneInput"

<small id="phoneError">

</small>

<label>

    Address

</label>

<textarea
    id="addressInput"
    placeholder="Enter Full Address">

</textarea>

<button
    onclick="updateProfile()">

    Update Profile

</button>


    </div>

</div>

<script src="app.js"></script>

</body>

</html>
